server:
  port: 8080

spring:
  application:
    name: ecommerce-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/ecommerce_db
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  # Vérification d'email + mot de passe oublié. Valeurs par défaut = Mailtrap
  # (service gratuit de test SMTP, capture les emails sans les envoyer à de
  # vraies boîtes — pratique pour développer/démontrer sans spammer
  # personne). Crée un compte sur mailtrap.io → Sandbox → SMTP Settings pour
  # récupérer tes identifiants.
  mail:
    host: ${SMTP_HOST:sandbox.smtp.mailtrap.io}
    port: ${SMTP_PORT:2525}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  cache:
    type: redis
    redis:
      time-to-live: 300000   # 5 min par défaut

app:
  jwt:
    secret: ${JWT_SECRET:changeMeInProdWithAVeryLongRandomSecretKeyPlease123456789}
    expiration-ms: 86400000   # 24h

  google:
    # Client ID OAuth 2.0 (type "Web application") créé dans Google Cloud
    # Console → APIs & Services → Credentials. C'est un identifiant PUBLIC
    # (pas un secret) : il est aussi utilisé côté frontend (VITE_GOOGLE_CLIENT_ID).
    client-id: ${GOOGLE_CLIENT_ID:}

  mail:
    from: ${MAIL_FROM:no-reply@newdevshop.local}

  # Utilisé pour construire les liens de vérification/réinitialisation
  # envoyés par email (ex. http://localhost:5173/verify-email?token=...).
  frontend-url: ${FRONTEND_URL:http://localhost:5173}

  pricing-service:
    base-url: ${PRICING_SERVICE_URL:http://localhost:8000}
    timeout-ms: 5000

  pricing:
    scheduler:
      cron: "0 */15 * * * *"   # recalcul toutes les 15 min
      enabled: false   # changed it here hs
  
  seed:
    enabled: ${SEED_ENABLED:true} # changed it here hs

logging:
  level:
    com.ecommerce: DEBUG
    org.springframework.security: INFO
